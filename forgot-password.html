<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1220">
  <title>Forgot Password | QuickSub">

  <style>
    :root {
      --bg: #0b1220;
      --card: #111c2e;
      --text: #f8fafc;
      --muted: #9caec4;
      --primary: #16a34a;
      --border: #2b3a50;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    .brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand a {
      color: #fff;
      font-size: 30px;
      font-weight: 800;
      text-decoration: none;
    }

    .brand span {
      color: #4ade80;
    }

    .brand p {
      color: var(--muted);
      font-size: 14px;
      margin-top: 10px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 24px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 25px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
      margin: 0 0 24px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #4ade80;
      box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.12);
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: var(--primary);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
      line-height: 1.6;
    }

    .message.error {
      display: block;
      color: #fecaca;
      background: rgba(127, 29, 29, 0.25);
      border: 1px solid #7f1d1d;
    }

    .message.success {
      display: block;
      color: #bbf7d0;
      background: rgba(20, 83, 45, 0.25);
      border: 1px solid #166534;
    }

    .footer {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
      line-height: 1.9;
      color: var(--muted);
    }

    .footer a {
      color: #4ade80;
      text-decoration: none;
      font-weight: 700;
    }

    @media (max-width: 380px) {
      .card {
        padding: 24px 18px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="brand">
      <a href="index.html">Quick<span>Sub</span></a>
      <p>Simple, convenient digital services.</p>
    </div>

    <section class="card">
      <h1>Forgot your password?</h1>

      <p class="subtitle">
        Enter the email address associated with your QuickSub account.
        If password recovery is available, we'll send instructions to that address.
      </p>

      <div id="message" class="message" role="alert" aria-live="polite"></div>

      <form id="forgotForm">
        <div class="field">
          <label for="email">Email address</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            maxlength="254"
            required
          >
        </div>

        <button type="submit" id="submitButton">
          Request Password Reset
        </button>
      </form>

      <div class="footer">
        Remembered your password?
        <a href="login.html">Sign in</a>
        <br>
        <a href="register.html">Create an account</a>
        <br>
        <a href="index.html">← Back to homepage</a>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById("forgotForm");
    const message = document.getElementById("message");
    const submitButton = document.getElementById("submitButton");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      message.className = "message";
      message.textContent = "";

      const email = document.getElementById("email").value.trim();

      submitButton.disabled = true;
      submitButton.textContent = "Please wait...";

      try {
        const response = await fetch("/api/forgot-password", {
          method: "POST",
          credentials: "same-origin",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ email })
        });

        const result = await response.json();

        if (!response.ok) {
          showMessage(
            result.message || "We couldn't process your request. Please try again later.",
            "error"
          );
          return;
        }

        showMessage(
          result.message ||
          "If an account matches that email, password-reset instructions will be sent when email delivery is configured.",
          "success"
        );

        form.reset();
      } catch (error) {
        showMessage(
          "We couldn't connect to QuickSub. Please try again later.",
          "error"
        );
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Request Password Reset";
      }
    });
  </script>
</body>
      </html>
