<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1220">
  <title>Reset Password | QuickSub">

  <style>
    :root {
      --bg: #0b1220;
      --card: #111c2e;
      --text: #f8fafc;
      --muted: #9caec4;
      --primary: #16a34a;
      --border: #2b3a50;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    .brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand a {
      color: #fff;
      font-size: 30px;
      font-weight: 800;
      text-decoration: none;
    }

    .brand span {
      color: #4ade80;
    }

    .brand p {
      color: var(--muted);
      font-size: 14px;
      margin-top: 10px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 24px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 25px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
      margin: 0 0 24px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #4ade80;
      box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.12);
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: var(--primary);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
      line-height: 1.6;
    }

    .message.error {
      display: block;
      color: #fecaca;
      background: rgba(127, 29, 29, 0.25);
      border: 1px solid #7f1d1d;
    }

    .message.success {
      display: block;
      color: #bbf7d0;
      background: rgba(20, 83, 45, 0.25);
      border: 1px solid #166534;
    }

    .footer {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
      line-height: 1.9;
      color: var(--muted);
    }

    .footer a {
      color: #4ade80;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="brand">
      <a href="index.html">Quick<span>Sub</span></a>
      <p>Simple, convenient digital services.</p>
    </div>

    <section class="card">
      <h1>Set a new password</h1>

      <p class="subtitle">
        Choose a new password for your QuickSub account.
        Your password must contain at least 12 characters.
      </p>

      <div id="message" class="message" role="alert" aria-live="polite"></div>

      <form id="resetForm">
        <div class="field">
          <label for="password">New password</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="new-password"
            minlength="12"
            maxlength="128"
            required
          >
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm new password</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            autocomplete="new-password"
            minlength="12"
            maxlength="128"
            required
          >
        </div>

        <button type="submit" id="submitButton">Reset Password</button>
      </form>

      <div class="footer">
        <a href="login.html">Return to sign in</a>
        <br>
        <a href="index.html">← Back to homepage</a>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById("resetForm");
    const message = document.getElementById("message");
    const submitButton = document.getElementById("submitButton");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      message.className = "message";
      message.textContent = "";

      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        showMessage("Your passwords do not match.", "error");
        return;
      }

      if (password.length < 12) {
        showMessage(
          "Your password must contain at least 12 characters.",
          "error"
        );
        return;
      }

      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");

      if (!token || token.length > 200) {
        showMessage(
          "This password-reset link is missing or invalid. Please request a new one.",
          "error"
        );
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Resetting password...";

      try {
        const response = await fetch("/api/reset-password", {
          method: "POST",
          credentials: "same-origin",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            token,
            password
          })
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
          showMessage(
            result.message ||
              "We couldn't reset your password. The link may have expired. Please request a new one.",
            "error"
          );
          return;
        }

        showMessage(
          "Your password has been reset. Redirecting you to sign in...",
          "success"
        );

        form.reset();

        setTimeout(() => {
          window.location.href = "login.html";
        }, 2000);
      } catch (error) {
        showMessage(
          "We couldn't connect to QuickSub. Please try again later.",
          "error"
        );
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Reset Password";
      }
    });
  </script>
</body>
          </html>
