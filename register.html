<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1220">
  <title>Create Account | QuickSub</title>
  <style>
    :root {
      --bg: #0b1220;
      --card: #111c2e;
      --text: #f8fafc;
      --muted: #9caec4;
      --primary: #16a34a;
      --border: #2b3a50;
      --danger: #f87171;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    .brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand a {
      color: #fff;
      font-size: 30px;
      font-weight: 800;
      text-decoration: none;
    }

    .brand span {
      color: #4ade80;
    }

    .brand p {
      color: var(--muted);
      margin-top: 10px;
      font-size: 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      margin: 0 0 24px;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input {
      display: block;
      width: 100%;
      padding: 13px 14px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #0b1220;
      color: var(--text);
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #4ade80;
      box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.12);
    }

    .hint {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: var(--primary);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 5px;
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      color: #fecaca;
      background: rgba(127, 29, 29, 0.25);
      border: 1px solid #7f1d1d;
    }

    .message.success {
      display: block;
      color: #bbf7d0;
      background: rgba(20, 83, 45, 0.25);
      border: 1px solid #166534;
    }

    .footer {
      text-align: center;
      margin-top: 22px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }

    .footer a {
      color: #4ade80;
      text-decoration: none;
      font-weight: 700;
    }

    .back {
      display: inline-block;
      margin-top: 18px;
      color: var(--muted);
      font-size: 14px;
      text-decoration: none;
    }

    @media (max-width: 380px) {
      .card {
        padding: 24px 18px;
      }

      h1 {
        font-size: 23px;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="brand">
      <a href="index.html">Quick<span>Sub</span></a>
      <p>Simple, convenient digital services.</p>
    </div>

    <section class="card">
      <h1>Create your account</h1>
      <p class="subtitle">
        Join QuickSub to manage your account and access digital services.
      </p>

      <div id="message" class="message" role="alert" aria-live="polite"></div>

      <form id="registerForm">
        <div class="field">
          <label for="fullName">Full name</label>
          <input
            type="text"
            id="fullName"
            name="fullName"
            autocomplete="name"
            maxlength="100"
            required
          >
        </div>

        <div class="field">
          <label for="email">Email address</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            maxlength="254"
            required
          >
        </div>

        <div class="field">
          <label for="phone">Phone number</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            autocomplete="tel"
            inputmode="tel"
            maxlength="20"
            placeholder="e.g. 08012345678"
            required
          >
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="new-password"
            minlength="12"
            maxlength="128"
            required
          >
          <span class="hint">
            Use at least 12 characters. Never share your password with anyone.
          </span>
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            autocomplete="new-password"
            minlength="12"
            maxlength="128"
            required
          >
        </div>

        <button type="submit" id="submitButton">Create Account</button>
      </form>

      <div class="footer">
        Already have an account?
        <a href="login.html">Sign in</a>
        <br>
        <a class="back" href="index.html">← Back to homepage</a>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");
    const submitButton = document.getElementById("submitButton");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.className = "message";
      message.textContent = "";

      const fullName = document.getElementById("fullName").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        showMessage("Your passwords do not match.", "error");
        return;
      }

      if (password.length < 12) {
        showMessage("Your password must contain at least 12 characters.", "error");
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Creating account...";

      try {
        const response = await fetch("/api/register", {
          method: "POST",
          credentials: "same-origin",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            fullName,
            email,
            phone,
            password
          })
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
          showMessage(
            result.message || "We couldn't create your account. Please try again.",
            "error"
          );
          return;
        }

        showMessage(
          "Your account has been created successfully. Redirecting to sign in...",
          "success"
        );

        form.reset();

        setTimeout(() => {
          window.location.href = "login.html";
        }, 1800);
      } catch (error) {
        showMessage(
          "We couldn't connect to QuickSub. Please try again later.",
          "error"
        );
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Create Account";
      }
    });
  </script>
</body>
            </html>
